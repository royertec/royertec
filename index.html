<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REPRODUCTOR PREMIUM - ROYER PRODUCCIONES</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: Arial, sans-serif;
        }
        .player-card {
            width: 95%; max-width: 780px; aspect-ratio: 16/9;
            border: 2px solid #1db954;
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.35);
            overflow: hidden; background: #000;
        }
        video {
            width: 100%; height: 100%; object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let streamUrl = urlParams.get('stream');
        
        // Si no se le pasa variable, carga ESPN 7 por defecto
        if (!streamUrl) {
            streamUrl = "http://tvdirect.pro:8080/live/Luis/Luis2025/3461.m3u8";
        }

        const video = document.getElementById('video');

        if (Hls.isSupported()) {
            const hls = new Hls({
                maxBufferLength: 30,
                lazyLoadMaxDuration: 30
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(e) {
                    console.log("Auto-play bloqueado por el navegador");
                });
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Soporte directo para iPhones
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
